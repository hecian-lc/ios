# CI con los workflows reutilizables de hecian-lc/.github.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Todavía no hay workflow reutilizable para Swift; compilar en macOS queda
  # para más adelante.
  seguridad:
    uses: hecian-lc/.github/.github/workflows/seguridad.yml@v1

  # Control de marca y licencia: falla si falta algo del estándar.
  marca:
    uses: hecian-lc/.github/.github/workflows/marca.yml@v1
    with:
      estricto: true
